name: visual-baselines

# Manually dispatched workflow that regenerates Playwright visual baselines
# in the same ubuntu-latest / playwright-jammy environment the `visual`
# workflow verifies against, then opens a PR with the updates.
#
# Run it when:
#  - First time setting up: no baselines exist yet
#  - An intentional UI change shifted the snapshots
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate baselines
        run: pnpm test:visual:update

      - name: Open PR with baseline updates
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(blog): refresh playwright baselines'
          title: 'Refresh Playwright visual baselines'
          body: |
            Automated refresh of Playwright visual-regression baselines.

            Generated by `.github/workflows/visual-baselines.yml` against the
            `mcr.microsoft.com/playwright:v1.59.1-jammy` image used by the
            `visual` workflow.
          branch: bot/visual-baselines
          delete-branch: true
          add-paths: |
            tests/visual/**/*.png
