name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate posts
        run: pnpm validate

      - name: Validator smoke tests
        run: pnpm validate:smoke

      - name: TypeScript
        run: pnpm tsc -b

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
