<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="A single-server queue: arrivals at rate lambda flow into a waiting line, then through one server at rate mu, then out."
     font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a" />
    </marker>
    <pattern id="queueHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="rgba(45,212,191,0.22)" />
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(13,148,136,0.55)" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="640" height="220" fill="transparent" />

  <!-- Arrival arrow + label -->
  <text x="60" y="100" font-size="16" fill="#0f172a">λ</text>
  <text x="30" y="125" font-size="12" fill="#475569">arrivals</text>
  <line x1="80" y1="110" x2="150" y2="110" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Queue boxes -->
  <g stroke="#0f172a" stroke-width="2">
    <rect x="160" y="90" width="40" height="40" fill="url(#queueHatch)" />
    <rect x="205" y="90" width="40" height="40" fill="url(#queueHatch)" />
    <rect x="250" y="90" width="40" height="40" fill="url(#queueHatch)" />
  </g>
  <text x="180" y="75" font-size="12" fill="#475569" text-anchor="middle">waiting</text>

  <!-- Queue → server arrow -->
  <line x1="295" y1="110" x2="345" y2="110" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Server -->
  <circle cx="400" cy="110" r="40" fill="rgba(45,212,191,0.35)" stroke="#0f172a" stroke-width="2.5" />
  <text x="400" y="108" font-size="22" fill="#0f172a" text-anchor="middle">μ</text>
  <text x="400" y="128" font-size="11" fill="#334155" text-anchor="middle">server</text>

  <!-- Server → departure arrow + label -->
  <line x1="445" y1="110" x2="555" y2="110" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="575" y="104" font-size="12" fill="#475569">departures</text>
  <text x="575" y="120" font-size="10" fill="#94a3b8">(rate μ while busy)</text>

  <!-- Utilization annotation -->
  <text x="320" y="185" font-size="13" fill="#0f172a" text-anchor="middle">
    utilisation
  </text>
  <text x="320" y="203" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">
    ρ = λ / μ
  </text>
</svg>
